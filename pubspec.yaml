name: ecohabit
description: "LifeHack 2026 — small green habits, tracked and gamified."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  go_router: ^14.2.7
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  # 0.16+ includes Apple Silicon simulator support for iOS 26.
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - .env
